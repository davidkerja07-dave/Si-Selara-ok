name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Fahfile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android SDK Environment, Licenses & Platforms
        run: |
          echo "Menyiapkan environment Android SDK..."
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$SDK_DIR"
          export ANDROID_SDK_ROOT="$SDK_DIR"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" >> "$ANDROID_HOME/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" >> "$ANDROID_HOME/licenses/android-sdk-preview-license"

          SDKMANAGER=$(command -v sdkmanager || find "$ANDROID_HOME" -name "sdkmanager" -type f 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            set +o pipefail
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platform-tools" "platforms;android-36.1" "build-tools;36.0.0" || true
          fi

      - name: Prepare .env and Debug Keystore
        run: |
          echo "Memeriksa file konfigurasi wajib..."

          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
              echo "File .env dibuat dari .env.example"
            else
              touch .env
              echo "File .env kosong dibuat"
            fi
          fi

          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore
              echo "debug.keystore berhasil dibuat dari Base64"
            else
              echo "Membuat debug.keystore dengan keytool..."
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
              echo "debug.keystore berhasil dibuat"
            fi
          fi

      - name: Make Gradlew Executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Izin eksekusi diberikan pada ./gradlew"
          else
            echo "::error::File gradlew tidak ditemukan."
            exit 1
          fi

      - name: Build Debug APK with Gradle
        run: |
          echo "Memulai proses kompilasi APK dengan Gradle Wrapper..."
          ./gradlew :app:assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            --stacktrace \
            -Pandroid.builder.sdkDownload=true

      - name: Collect APK Files
        run: |
          echo "Mengumpulkan file APK hasil build..."
          mkdir -p build-apks

          find app/build/outputs/apk \
            -name "*.apk" \
            -type f \
            -exec cp -v {} build-apks/ \;

          APK_COUNT=$(find build-apks -maxdepth 1 -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "::error::Tidak ada file APK yang ditemukan setelah assembleDebug!"
            exit 1
          fi

          echo "Ditemukan $APK_COUNT file APK:"
          ls -lh build-apks/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fahfile-debug-apk
          path: build-apks/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Print Build Diagnostics on Failure
        if: failure()
        run: |
          echo "=============================================="
          echo "BUILD GAGAL - DETAIL DIAGNOSTIK"
          echo "=============================================="
          echo "Versi Java:"
          java -version || true
          echo "----------------------------------------------"
          echo "Versi Gradle:"
          if [ -f "./gradlew" ]; then
            ./gradlew --version || true
          fi
          echo "----------------------------------------------"
          echo "Daftar File Direktori:"
          ls -la
          echo "----------------------------------------------"
          echo "Daftar File app/:"
          ls -la app/ || true
          echo "=============================================="
